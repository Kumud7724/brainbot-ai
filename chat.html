<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrainBot AI Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="dashboard.html">

🧠 BrainBot AI

</a>

<div>

<a href="dashboard.html" class="btn btn-outline-light">

Dashboard

</a>

<a href="login.html" class="btn btn-danger ms-2">

Logout

</a>

</div>

</div>

</nav>

<!-- Chat Section -->

<section class="chat-section">

<div class="container">

<h2 class="text-center mb-2">

🤖 BrainBot AI Assistant

</h2>

<p class="text-center text-light mb-4">

Ask any academic question and BrainBot AI will help you.

</p>

<div class="chat-box" id="chatBox">

<div class="bot-message">

Hello 👋<br>

I am <strong>BrainBot AI</strong>.

How can I help you today?

</div>

</div>

<div class="input-group mt-4">

<input
type="text"
id="userInput"
class="form-control"
placeholder="Type your question...">

<button
class="btn btn-primary"
id="sendBtn">

Send

</button>

</div>

</div>

</section>

<script src="js/chat.js"></script>

</body>

</html>

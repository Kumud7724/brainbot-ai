<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Generator | BrainBot AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand" href="dashboard.html">

🧠 BrainBot AI

</a>

<div>

<a href="dashboard.html" class="btn btn-outline-light">

Dashboard

</a>

<a href="login.html" class="btn btn-danger ms-2">

Logout

</a>

</div>

</div>

</nav>

<section class="quiz-section">

<div class="container">

<h1 class="text-center">

❓ AI Quiz Generator

</h1>

<p class="text-center mb-5">

Enter a topic and generate a practice quiz.

</p>

<div class="quiz-card">

<label class="mb-2">

Enter Topic

</label>

<input
type="text"
id="quizTopic"
class="form-control"
placeholder="Example: Java">

<button
class="btn btn-primary mt-4 w-100"
id="quizBtn">

Generate Quiz

</button>

</div>

<div class="quiz-output mt-5">

<h3>

Generated Quiz

</h3>

<div id="quizResult">

Your quiz will appear here.

</div>

</div>

</div>

</section>

<script src="js/quiz.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

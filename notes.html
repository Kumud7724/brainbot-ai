<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrainBot AI | Notes Generator</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="dashboard.html">

            🧠 BrainBot AI

        </a>

        <div>

            <a href="dashboard.html" class="btn btn-outline-light">

                Dashboard

            </a>

            <a href="login.html" class="btn btn-danger ms-2">

                Logout

            </a>

        </div>

    </div>

</nav>

<!-- Notes Section -->

<section class="container py-5">

    <h2 class="text-center mb-4">

        📝 AI Notes Generator

    </h2>

    <div class="card p-4 shadow">

        <label class="mb-2">

            Enter Topic

        </label>

        <input
            type="text"
            id="topic"
            class="form-control"
            placeholder="Example: Operating System">

        <button
            class="btn btn-primary mt-3"
            onclick="generateNotes()">

            Generate Notes

        </button>

    </div>

    <div class="card mt-4 p-4 shadow">

        <h4>Generated Notes</h4>

        <div id="notesResult">

            Your AI-generated notes will appear here...

        </div>

    </div>

</section>

<script src="js/notes.js"></script>

</body>

</html>
